<!DOCTYPE html>

<meta charset="UTF-8">

<title>Flying Balloons 🎈</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 75% 20%, #432550 0%, transparent 35%),
        linear-gradient(135deg, #160b20, #281333, #1a0d26);
    font-family: Arial, sans-serif;
    color: #fff2e6;
}

/* Birthday message */
.content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    pointer-events: none;
}

.content h1 {
    font-size: clamp(32px, 6vw, 65px);
    margin-bottom: 20px;
    text-shadow: 0 0 25px #c58aff;
}

.content p {
    font-size: clamp(16px, 2.5vw, 21px);
    line-height: 1.8;
}

.heart {
    font-size: 65px;
    margin-bottom: 20px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.2); }
}

/* Balloon layer */
.balloon-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.balloon {
    position: absolute;
    bottom: -180px;
    left: var(--left);
    width: var(--size);
    height: calc(var(--size) * 1.3);
    background: var(--color);
    border-radius: 50% 50% 45% 45%;
    opacity: 0.92;
    box-shadow:
        inset -9px -8px 15px rgba(0,0,0,0.12),
        inset 8px 8px 13px rgba(255,255,255,0.35),
        0 0 20px var(--glow);
    animation: flyUp var(--speed) linear var(--delay) infinite;
    will-change: transform;
}

/* Balloon shine */
.balloon::before {
    content: "";
    position: absolute;
    top: 15%;
    left: 20%;
    width: 13%;
    height: 28%;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    transform: rotate(25deg);
}

/* Balloon knot */
.balloon::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 43%;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 9px solid var(--color);
}

/* Balloon string */
.string {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    width: 1px;
    height: calc(var(--size) * 1.4);
    background: rgba(255,255,255,0.55);
    transform-origin: top;
    animation: sway 1.3s ease-in-out infinite alternate;
}

@keyframes flyUp {
    0% {
        transform: translate3d(0, 0, 0) rotate(-7deg);
    }
    25% {
        transform: translate3d(35px, -28vh, 0) rotate(8deg);
    }
    50% {
        transform: translate3d(-25px, -56vh, 0) rotate(-7deg);
    }
    75% {
        transform: translate3d(30px, -84vh, 0) rotate(7deg);
    }
    100% {
        transform: translate3d(-15px, -125vh, 0) rotate(-5deg);
    }
}

@keyframes sway {
    from { transform: rotate(-12deg); }
    to   { transform: rotate(12deg); }
}

/* Mobile screen */
@media (max-width: 600px) {
    .balloon {
        width: calc(var(--size) * 0.75);
        height: calc(var(--size) * 0.98);
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .balloon, .string, .heart {
        animation-play-state: paused;
    }
}
</style>
